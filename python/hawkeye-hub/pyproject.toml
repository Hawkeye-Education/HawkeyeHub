[project]
name = "hawkeye-hub"
version = "1.0.0" # major equals the Hub API major (ADR 0011)
description = "Python SDK for Hawkeye Hub Plugin Backends: stdio JSON-RPC handlers and a test harness."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.urls]
Repository = "https://github.com/Hawkeye-Education/HawkeyeHub"

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.400", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.13.5" # the uv the Hub downloads (apps/hub/src/main/uv.ts)

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
