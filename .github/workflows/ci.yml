name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch's history, for --only-changed below.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The smoke suite's global setup makes fixture Backends' venvs with `uv venv`.
      - uses: astral-sh/setup-uv@v6
      # Electron downloads its binary on first use; do it here, not inside the first test's timeout.
      - run: pnpm --filter @hawkeye-hub/hub exec install-electron
      - run: pnpm --filter @hawkeye-hub/hub exec electron-vite build
      - run: pnpm --filter @hawkeye-hub/hub exec playwright test e2e/hub-settings-discard.smoke.ts --repeat-each 20 --trace retain-on-failure --reporter list
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: apps/hub/test-results
