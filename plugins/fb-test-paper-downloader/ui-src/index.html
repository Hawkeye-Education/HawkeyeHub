<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The Hub preload has already set <html lang>, loaded the --hub-* tokens, the native-element
         stylesheet and the Hub Kit, and exposed window.hub (PLUGIN_STANDARD.md §4.2). -->
    <link rel="stylesheet" href="./layout.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="stack">
      <section class="stack">
        <label class="stack-tight">
          <span id="group-label"></span>
          <input id="group" type="text" />
        </label>
        <hub-folder-field id="output"></hub-folder-field>
      </section>

      <section class="stack">
        <div class="row">
          <button id="sign-in" type="button"></button>
          <button id="update" type="button" data-variant="primary"></button>
          <button id="stop" type="button" hidden></button>
          <label
            ><input id="stop-at-known" type="checkbox" />
            <span id="stop-at-known-label"></span
          ></label>
        </div>
        <progress id="progress" value="0" max="1"></progress>
        <p id="status" role="status"></p>
      </section>

      <hub-log id="log"></hub-log>
    </main>
  </body>
</html>
