<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The Hub preload has already set <html lang>, loaded the --hub-* tokens, the native-element
         stylesheet and the Hub Kit, and exposed window.hub (PLUGIN_STANDARD.md §4.2). -->
    <link rel="stylesheet" href="./layout.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="stack">
      <label class="stack-tight">
        <span id="files-label"></span>
        <input id="files" type="file" accept="image/jpeg,image/png" multiple />
      </label>
      <p id="hint"></p>

      <div class="row">
        <button id="run" type="button" data-variant="primary" disabled></button>
        <button id="save" type="button" disabled></button>
      </div>
      <p id="summary" role="status"></p>

      <ol id="list" class="stack"></ol>
    </main>
  </body>
</html>
