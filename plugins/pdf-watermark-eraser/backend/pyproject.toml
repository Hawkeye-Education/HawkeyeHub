[project]
name = "pdf-watermark-eraser-backend"
version = "1.0.1"            # equals the Manifest version
requires-python = "==3.12.*" # agrees with the Manifest's backend.python
dependencies = ["pymupdf>=1.24", "hawkeye-hub>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.400", "ruff>=0.12"] # never installed for staff: the Hub runs `uv sync --frozen --no-dev`

[tool.uv]
required-version = "==0.13.5" # the uv the Hub downloads (apps/hub/src/main/uv.ts)
package = false               # a script the Hub runs, not a package to build

[tool.pyright]
typeCheckingMode = "strict"
include = [".", "tests"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
