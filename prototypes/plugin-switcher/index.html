<!doctype html>
<!-- PROTOTYPE (#144), throwaway. Three Plugin Switcher variants (?variant=A|B|C) on one fake Hub
     window, with the header strip, and collapse shown both ways (?collapse=rail|hidden). Uses the
     real hawkeye.css + native.css; the bottom bar flips variant, Colour Scheme and collapse mode.
     Light/dark is forced by switching hawkeye.css's prefers-color-scheme rule through the CSSOM. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin Switcher prototype</title>
<link rel="stylesheet" href="../../apps/hub/src/hub-kit/hawkeye.css">
<link rel="stylesheet" href="../../apps/hub/src/hub-kit/native.css">
<style>
  /* hawkeye.css loads fonts from hawkeye-hub-kit://, which only main serves; point at the files. */
  @font-face { font-family: "Inter"; src: url("../../apps/hub/src/hub-kit/fonts/Inter.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Noto Sans TC"; src: url("../../apps/hub/src/hub-kit/fonts/NotoSansTC.woff2") format("woff2"); font-weight: 100 900; }

  /* The Theme's solid tint behind every view (Windows 10), light and dark. */
  :root { --tint: linear-gradient(160deg, #f8f3ee, #ede5dd); --item-hover: color-mix(in srgb, var(--hub-color-accent) 9%, transparent);
          --item-front: color-mix(in srgb, var(--hub-color-accent) 17%, transparent); }
  :root[data-scheme="dark"] { --tint: linear-gradient(160deg, #26211e, #1b1816); }
  html, body { height: 100%; }
  body { background: var(--tint); overflow: hidden; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .win { display: flex; height: 100vh; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .body { flex: 1; display: flex; min-height: 0; gap: var(--hub-space-2); padding: 0 var(--hub-space-2) var(--hub-space-2) 0; }
  .win.no-side .body { padding-left: var(--hub-space-2); }
  .view { flex: 1; overflow: auto; background: var(--hub-color-surface); border: 1px solid var(--hub-color-line);
          border-radius: var(--hub-radius-3); padding: var(--hub-space-5); display: flex; flex-direction: column; gap: var(--hub-space-4); }
  .view .form { display: grid; gap: var(--hub-space-3); max-width: 420px; }
  .view .form label { display: grid; gap: var(--hub-space-1); }
  .view .row-btns { display: flex; gap: var(--hub-space-2); }
  .empty { align-items: center; justify-content: center; text-align: center; }

  /* Bare buttons inside the Hub Chrome: no native.css box. */
  .bare { border: 0; background: none; box-shadow: none; padding: 0; min-height: 0; color: inherit; }
  .bare:hover:not(:disabled) { background-image: none; }

  .logo { position: relative; flex: none; width: 28px; height: 28px; border-radius: 8px; background: #ff6b35; }
  .logo i { position: absolute; inset: 3px; background: #fff; -webkit-mask: url(logo-mark.png) center / contain no-repeat; mask: url(logo-mark.png) center / contain no-repeat; }
  .brand { display: flex; align-items: center; gap: var(--hub-space-2); padding: var(--hub-space-3) var(--hub-space-3) var(--hub-space-2); }
  .word { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .word span { font-weight: 400; color: var(--hub-color-fg-muted); }

  /* ---------- Switcher, shared row ---------- */
  .sw { flex: none; width: 248px; display: flex; flex-direction: column; min-height: 0; }
  .scroll { flex: 1; overflow-y: auto; padding: 0 var(--hub-space-2) var(--hub-space-2); }
  .sec { margin: var(--hub-space-3) var(--hub-space-3) var(--hub-space-1); font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
         text-transform: uppercase; color: var(--hub-color-fg-muted); }
  .hint { margin: 0 var(--hub-space-3); font-size: var(--hub-text-sm); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .row { display: flex; align-items: center; border-radius: 999px; transition: background var(--hub-motion-fast) var(--hub-motion-ease); }
  .row:hover { background: var(--item-hover); }
  .row[aria-current] { background: var(--item-front); }
  .row[aria-current] .name { font-weight: 600; }
  .row[aria-current] .main > svg { color: var(--hub-color-accent); }
  .row .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 4px 6px 12px; min-height: 34px; text-align: start; }
  .row .main:active:not(:disabled) { transform: none; }
  .txt { display: grid; min-width: 0; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 11.5px; color: var(--hub-color-fg-muted); line-height: 1.3; }
  .blocked .main { opacity: 0.55; cursor: default; }
  .blocked .sub { color: var(--hub-color-warning); opacity: 1; }
  .closing .main { opacity: 0.55; }
  .mini { width: 26px; height: 26px; margin-right: 3px; border-radius: 50%; display: grid; place-items: center; color: var(--hub-color-fg-muted); }
  .mini:hover:not(:disabled) { background: var(--item-hover); color: var(--hub-color-fg); }
  .mini svg { width: 15px; height: 15px; }
  .star { opacity: 0; }
  .row:hover .star, .row:focus-within .star, .tile:hover .star, .tile:focus-within .star { opacity: 1; }
  .star.on svg { fill: var(--hub-color-accent); stroke: var(--hub-color-accent); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hub-color-success); flex: none; }
  .foot { padding: var(--hub-space-2); border-top: 1px solid var(--hub-color-line); display: grid; gap: 2px; }

  /* ---------- A: Sidebar list ---------- */
  .swA .foot .row .main { padding-left: 12px; }

  /* ---------- B: Launcher (Favourites as tiles, actions up top) ---------- */
  .swB { width: 264px; }
  .swB .brand { padding-right: var(--hub-space-2); }
  .swB .brand .acts { margin-left: auto; display: flex; gap: 2px; }
  .ib { width: 32px; height: 32px; border-radius: var(--hub-radius-2); display: grid; place-items: center; color: var(--hub-color-fg-muted); }
  .ib:hover:not(:disabled) { background: var(--item-hover); color: var(--hub-color-fg); }
  .ib[aria-current] { background: var(--item-front); color: var(--hub-color-accent); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--hub-space-1); }
  .tile { position: relative; }
  .tile .main { width: 100%; display: grid; justify-items: center; gap: 6px; padding: 10px 4px 8px; border-radius: var(--hub-radius-2);
                font-size: 11.5px; text-align: center; line-height: 1.25; }
  .tile .main svg { width: 22px; height: 22px; }
  .tile .main:hover:not(:disabled) { background: var(--item-hover); }
  .tile[aria-current] .main { background: var(--item-front); font-weight: 600; }
  .tile[aria-current] .main svg { color: var(--hub-color-accent); }
  .tile.blocked .main { opacity: 0.5; cursor: default; }
  .tile .star, .tile .x { position: absolute; top: 0; margin: 0; width: 22px; height: 22px; }
  .tile .star { right: 0; } .tile .x { left: 0; opacity: 0; } .tile:hover .x { opacity: 1; }
  .tile .dot { position: absolute; top: 8px; left: calc(50% + 12px); }
  .tile .reason { font-size: 10.5px; color: var(--hub-color-warning); }
  .swB .row .main { min-height: 30px; padding-block: 4px; }

  /* ---------- C: Floating card, two-line rows ---------- */
  .swC { width: 256px; margin: 0 var(--hub-space-2) var(--hub-space-2); background: var(--hub-color-surface); border: 1px solid var(--hub-color-line);
         border-radius: var(--hub-radius-3); box-shadow: var(--hub-shadow-1); }
  .win.side-c .body { padding-left: 0; }
  .swC .row { border-radius: var(--hub-radius-2); }
  .swC .row .main { min-height: 44px; }
  .swC .row .main > svg { width: 20px; height: 20px; padding: 6px; border-radius: 8px; background: var(--hub-color-surface-raised); box-sizing: content-box; }
  .swC .foot { grid-template-columns: 1fr auto; gap: var(--hub-space-2); border: 0; }
  .swC .foot button[data-variant] { display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; }

  /* ---------- Collapsed: icon rail ---------- */
  .rail { flex: none; width: 56px; display: flex; flex-direction: column; align-items: center; min-height: 0; }
  .rail .brand { padding: var(--hub-space-3) 0 var(--hub-space-2); }
  .rail .scroll { padding: 0 0 var(--hub-space-2); display: grid; align-content: start; justify-items: center; gap: 2px; scrollbar-width: none; }
  .rail hr { width: 24px; margin: 6px 0; }
  .ri { position: relative; width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; }
  .ri:hover:not(:disabled) { background: var(--item-hover); }
  .ri[aria-current] { background: var(--item-front); color: var(--hub-color-accent); }
  .ri.blocked, .ri:disabled { opacity: 0.45; }
  .ri .dot { position: absolute; right: 5px; bottom: 7px; }
  .rail .foot { border-top: 1px solid var(--hub-color-line); padding: var(--hub-space-2) 0; }
  #tip { position: fixed; z-index: 10; pointer-events: none; padding: 4px 10px; border-radius: var(--hub-radius-1); font-size: var(--hub-text-sm);
         background: var(--hub-color-surface-raised); border: 1px solid var(--hub-color-line); box-shadow: var(--hub-shadow-2); white-space: nowrap; }

  /* ---------- Header strip ---------- */
  .strip { flex: none; height: 48px; display: flex; align-items: center; gap: var(--hub-space-2); padding: 0 var(--hub-space-2) 0 var(--hub-space-1); }
  .strip .title { display: flex; align-items: center; gap: var(--hub-space-2); font-weight: 600; min-width: 0; }
  .strip .title svg { color: var(--hub-color-accent); }
  .assist { margin-left: auto; display: flex; align-items: center; gap: 6px; border-radius: 999px; padding-inline: 12px 14px; }
  .assist[aria-pressed="true"] { background: var(--item-front); border-color: color-mix(in srgb, var(--hub-color-accent) 45%, transparent); color: var(--hub-color-accent); }
  .assist svg { color: var(--hub-color-accent); }
  .panel { flex: none; width: 340px; background: var(--hub-color-surface); border: 1px solid var(--hub-color-line); border-radius: var(--hub-radius-3);
           padding: var(--hub-space-4); display: flex; flex-direction: column; gap: var(--hub-space-3); }
  .panel textarea { margin-top: auto; min-height: 72px; resize: none; }

  /* ---------- Prototype bar (not part of the design) ---------- */
  .pbar { position: fixed; z-index: 20; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
          padding: 6px; border-radius: 999px; background: #111; color: #fff; box-shadow: 0 6px 24px rgb(0 0 0 / .45);
          font: 12px/1 system-ui, sans-serif; color-scheme: dark; }
  .pbar button { all: unset; cursor: pointer; padding: 7px 12px; border-radius: 999px; background: #2a2a2a; }
  .pbar button:hover { background: #3a3a3a; }
  .pbar .lbl { padding: 0 6px; min-width: 150px; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" hidden></div>
<div class="pbar">
  <button data-p="prev">‹</button><span class="lbl" id="vlabel"></span><button data-p="next">›</button>
  <button data-p="scheme" id="pscheme"></button>
  <button data-p="cmode" id="pcollapse"></button>
</div>
<script>
// Lucide icons (ISC), inline.
const I = {
  sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>',
  star: '<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>',
  settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  grid: '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  panel: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  eraser: '<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>',
  calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  clipboard: '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  chart: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  image: '<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  printer: '<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>',
  music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  cap: '<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
  pencil: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
};
const ico = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

// Fake Plugins, in main's order. `blocked` is the reason the Hub can't run it.
const P = [
  { id: 'eraser', name: 'PDF Watermark Eraser', icon: 'eraser' },
  { id: 'timetable', name: 'Timetable', icon: 'calendar' },
  { id: 'reports', name: 'Report Cards', icon: 'clipboard', blocked: 'Needs sign-in' },
  { id: 'letters', name: 'Parent Letters', icon: 'mail' },
  { id: 'marks', name: 'Mark Book', icon: 'chart' },
  { id: 'roster', name: 'Class Roster', icon: 'users' },
  { id: 'worksheets', name: 'Worksheet Maker', icon: 'file' },
  { id: 'reading', name: 'Reading Log', icon: 'book' },
  { id: 'photos', name: 'Photo Resizer', icon: 'image' },
  { id: 'timer', name: 'Lesson Timer', icon: 'clock' },
  { id: 'printing', name: 'Print Queue', icon: 'printer', blocked: 'Not for this computer' },
  { id: 'music', name: 'Music Room', icon: 'music' },
  { id: 'translate', name: 'Translator', icon: 'globe' },
  { id: 'files', name: 'Shared Drive', icon: 'folder' },
  { id: 'exams', name: 'Exam Builder', icon: 'cap' },
  { id: 'notes', name: 'Lesson Notes', icon: 'pencil', blocked: 'Needs a different Hub' },
];
const byId = (id) => P.find((p) => p.id === id);
const VARIANTS = { A: 'Sidebar list', B: 'Launcher tiles', C: 'Floating card' };

const q = new URLSearchParams(location.search);
const S = {
  variant: VARIANTS[q.get('variant')] ? q.get('variant') : 'A',
  scheme: q.get('scheme') ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
  collapseMode: q.get('collapse') === 'hidden' ? 'hidden' : 'rail',
  collapsed: false,
  favs: new Set(['timetable', 'reports', 'eraser']),
  open: ['eraser', 'timetable', 'marks', 'roster'],
  closing: ['roster'],
  front: 'eraser',
  screen: 'plugin', // plugin | settings | catalogue | empty
  assistant: false,
};

function rowState(p) {
  const open = S.open.includes(p.id), closing = S.closing.includes(p.id);
  return { open, closing, fav: S.favs.has(p.id), front: S.screen === 'plugin' && S.front === p.id,
           status: p.blocked ?? (closing ? 'Closing…' : open ? 'Open' : '') };
}

function row(p, alwaysSub) {
  const r = rowState(p);
  const sub = p.blocked || r.closing || (alwaysSub && r.status) ? `<span class="sub">${r.status}</span>` : '';
  const inner = `${ico(p.icon)}<span class="txt"><span class="name">${p.name}</span>${sub}</span>${r.open && !r.closing && !alwaysSub ? '<span class="dot" title="Open"></span>' : ''}`;
  return `<li class="row ${p.blocked ? 'blocked' : ''} ${r.closing ? 'closing' : ''}" ${r.front ? 'aria-current="page"' : ''}>
    ${p.blocked ? `<span class="main">${inner}</span>`
      : `<button class="bare main" data-act="open" data-id="${p.id}" ${r.closing ? 'disabled' : ''}>${inner}</button>`}
    <button class="bare mini star ${r.fav ? 'on' : ''}" data-act="fav" data-id="${p.id}" aria-pressed="${r.fav}" aria-label="${r.fav ? 'Remove from' : 'Add to'} Favourites">${ico('star')}</button>
    ${r.open && !r.closing ? `<button class="bare mini" data-act="close" data-id="${p.id}" aria-label="Close ${p.name}">${ico('x')}</button>` : ''}
  </li>`;
}

function tile(p) {
  const r = rowState(p);
  const inner = `${ico(p.icon)}<span>${p.name}</span>${p.blocked ? `<span class="reason">${p.blocked}</span>` : r.closing ? '<span class="reason">Closing…</span>' : ''}`;
  return `<li class="tile ${p.blocked ? 'blocked' : ''}" ${r.front ? 'aria-current="page"' : ''}>
    ${p.blocked ? `<span class="main">${inner}</span>` : `<button class="bare main" data-act="open" data-id="${p.id}" ${r.closing ? 'disabled' : ''}>${inner}</button>`}
    ${r.open && !r.closing ? `<span class="dot"></span><button class="bare mini x" data-act="close" data-id="${p.id}" aria-label="Close ${p.name}">${ico('x')}</button>` : ''}
    <button class="bare mini star on" data-act="fav" data-id="${p.id}" aria-pressed="true" aria-label="Remove from Favourites">${ico('star')}</button>
  </li>`;
}

const favs = () => P.filter((p) => S.favs.has(p.id));
const rest = () => P.filter((p) => !S.favs.has(p.id));
const brand = (extra = '') => `<div class="brand"><span class="logo" aria-hidden="true"><i></i></span><span class="word">Hawkeye <span>Hub</span></span>${extra}</div>`;
const cur = (screen) => (S.screen === screen ? 'aria-current="page"' : '');
const noFavs = '<p class="hint">Star a Plugin to keep it here.</p>';

function switcherA(alwaysSub = false, cls = 'swA') {
  return `<nav class="sw ${cls}" aria-label="Plugins">${brand()}
    <div class="scroll">
      <div class="sec">Favourites</div>${favs().length ? `<ul>${favs().map((p) => row(p, alwaysSub)).join('')}</ul>` : noFavs}
      <div class="sec">Plugins</div><ul>${rest().map((p) => row(p, alwaysSub)).join('')}</ul>
    </div>
    ${cls === 'swA' ? `<div class="foot"><ul>
      <li class="row" ${cur('catalogue')}><button class="bare main" data-act="screen" data-screen="catalogue">${ico('grid')}<span class="name">Plugin Catalogue</span></button></li>
      <li class="row" ${cur('settings')}><button class="bare main" data-act="screen" data-screen="settings">${ico('settings')}<span class="name">Settings</span></button></li>
    </ul></div>` : `<div class="foot">
      <button data-variant="primary" data-act="screen" data-screen="catalogue">${ico('grid')}Browse Plugins</button>
      <button data-act="screen" data-screen="settings" aria-label="Settings" title="Settings" style="padding-inline:8px">${ico('settings')}</button>
    </div>`}
  </nav>`;
}

function switcherB() {
  const acts = `<span class="acts">
    <button class="bare ib" data-act="screen" data-screen="catalogue" ${cur('catalogue')} aria-label="Plugin Catalogue" data-tip="Plugin Catalogue">${ico('grid')}</button>
    <button class="bare ib" data-act="screen" data-screen="settings" ${cur('settings')} aria-label="Settings" data-tip="Settings">${ico('settings')}</button></span>`;
  return `<nav class="sw swB" aria-label="Plugins">${brand(acts)}
    <div class="scroll">
      <div class="sec">Favourites</div>${favs().length ? `<ul class="tiles">${favs().map(tile).join('')}</ul>` : noFavs}
      <div class="sec">All Plugins</div><ul>${rest().map((p) => row(p)).join('')}</ul>
    </div></nav>`;
}

function rail() {
  const item = (p) => {
    const r = rowState(p);
    const tip = p.name + (r.status ? ` · ${r.status}` : '');
    return `<button class="bare ri ${p.blocked ? 'blocked' : ''}" data-act="${p.blocked ? '' : 'open'}" data-id="${p.id}" data-tip="${tip}"
      aria-label="${tip}" ${r.front ? 'aria-current="page"' : ''} ${r.closing ? 'disabled' : ''}>${ico(p.icon)}${r.open && !r.closing ? '<span class="dot"></span>' : ''}</button>`;
  };
  return `<nav class="rail" aria-label="Plugins"><div class="brand"><span class="logo" aria-hidden="true"><i></i></span></div>
    <div class="scroll">${favs().map(item).join('')}${favs().length ? '<hr>' : ''}${rest().map(item).join('')}</div>
    <div class="foot">
      <button class="bare ri" data-act="screen" data-screen="catalogue" ${cur('catalogue')} data-tip="Plugin Catalogue" aria-label="Plugin Catalogue">${ico('grid')}</button>
      <button class="bare ri" data-act="screen" data-screen="settings" ${cur('settings')} data-tip="Settings" aria-label="Settings">${ico('settings')}</button>
    </div></nav>`;
}

function header() {
  const p = S.screen === 'plugin' && byId(S.front);
  const title = p ? `${ico(p.icon)}<span class="name">${p.name}</span>`
    : `<span>${{ settings: 'Settings', catalogue: 'Plugin Catalogue', empty: 'Hawkeye Hub' }[S.screen]}</span>`;
  return `<header class="strip">
    <button class="bare ib" data-act="collapse" aria-expanded="${!S.collapsed}" aria-label="${S.collapsed ? 'Show' : 'Hide'} Plugin Switcher" data-tip="${S.collapsed ? 'Show' : 'Hide'} Plugin Switcher">${ico('panel')}</button>
    <div class="title">${title}</div>
    ${p ? `<button class="assist" data-act="assistant" aria-pressed="${S.assistant}">${ico('sparkles')}<span>Assistant</span></button>` : ''}
  </header>`;
}

function view() {
  if (S.screen === 'plugin') {
    const p = byId(S.front);
    return `<section class="view"><h1>${p.name}</h1><p>A fake Plugin UI, built from native elements and native.css.</p>
      <div class="form"><label>Class<select><option>4A</option><option>4B</option></select></label>
      <label>Title<input placeholder="Untitled"></label><label><span><input type="checkbox" checked> Include notes</span></label>
      <div class="row-btns"><button data-variant="primary">Run</button><button>Cancel</button></div></div></section>`;
  }
  if (S.screen === 'settings') return `<section class="view"><h2>Appearance</h2><div class="form"><label>Colour Scheme<select><option>System</option><option>Light</option><option>Dark</option></select></label>
      <div class="row-btns"><button data-variant="primary">Save</button><button>Cancel</button></div></div></section>`;
  if (S.screen === 'catalogue') return `<section class="view"><h2>Plugin Catalogue</h2><p>Tiles come from the Catalogue prototype; only the header strip matters here.</p></section>`;
  return `<section class="view empty"><span class="logo" style="width:48px;height:48px;border-radius:14px"><i style="inset:6px"></i></span><h2>No Plugin open</h2><p>Pick one from the Plugin Switcher.</p></section>`;
}

function render() {
  const side = S.collapsed ? (S.collapseMode === 'rail' ? rail() : '')
    : { A: () => switcherA(), B: switcherB, C: () => switcherA(true, 'swC') }[S.variant]();
  const panel = S.assistant && S.screen === 'plugin'
    ? `<aside class="panel"><h2>Assistant</h2><p>The Panel itself is the Assistant prototype (#145).</p><textarea placeholder="Ask about ${byId(S.front).name}…"></textarea></aside>` : '';
  const scroll = document.querySelector('.scroll')?.scrollTop;
  document.getElementById('app').innerHTML = `<div class="win ${side ? '' : 'no-side'} ${!S.collapsed && S.variant === 'C' ? 'side-c' : ''}">
    ${side}<div class="main">${header()}<div class="body">${view()}${panel}</div></div></div>`;
  if (scroll) document.querySelector('.scroll').scrollTop = scroll;
  document.getElementById('vlabel').textContent = `${S.variant} · ${VARIANTS[S.variant]}`;
  document.getElementById('pscheme').textContent = `scheme: ${S.scheme}`;
  document.getElementById('pcollapse').textContent = `collapse: ${S.collapseMode}`;
  history.replaceState(null, '', `?${new URLSearchParams({ variant: S.variant, scheme: S.scheme, collapse: S.collapseMode })}`);
}

// Force hawkeye.css's dark block on or off, whatever the OS says.
function applyScheme() {
  for (const sheet of document.styleSheets) for (const rule of sheet.cssRules)
    if (rule instanceof CSSMediaRule && rule.conditionText.includes('prefers-color-scheme'))
      rule.media.mediaText = S.scheme === 'dark' ? 'all' : 'not all';
  document.documentElement.dataset.scheme = S.scheme;
  document.documentElement.style.colorScheme = S.scheme;
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act], [data-p]');
  if (!b || b.disabled) return;
  const id = b.dataset.id;
  switch (b.dataset.act ?? b.dataset.p) {
    case 'open':
      if (!S.open.includes(id)) S.open.push(id);
      Object.assign(S, { front: id, screen: 'plugin' }); break;
    case 'close':
      S.closing.push(id);
      setTimeout(() => {
        S.closing = S.closing.filter((x) => x !== id); S.open = S.open.filter((x) => x !== id);
        if (S.front === id) { S.front = null; if (S.screen === 'plugin') { S.screen = 'empty'; S.assistant = false; } }
        render();
      }, 1800); break;
    case 'fav': S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); break;
    case 'screen': S.screen = b.dataset.screen; break;
    case 'assistant': S.assistant = !S.assistant; break;
    case 'collapse': S.collapsed = !S.collapsed; hideTip(); break;
    case 'prev': case 'next': {
      const keys = Object.keys(VARIANTS), d = b.dataset.p === 'next' ? 1 : keys.length - 1;
      S.variant = keys[(keys.indexOf(S.variant) + d) % keys.length]; break;
    }
    case 'scheme': S.scheme = S.scheme === 'dark' ? 'light' : 'dark'; applyScheme(); break;
    case 'cmode': S.collapseMode = S.collapseMode === 'rail' ? 'hidden' : 'rail'; S.collapsed = true; break;
  }
  render();
});

document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') document.querySelector(`[data-p="${e.key === 'ArrowLeft' ? 'prev' : 'next'}"]`).click();
});

// One floating tooltip, so a scrolling rail can't clip it.
const tip = document.getElementById('tip');
function hideTip() { tip.hidden = true; }
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-tip]');
  if (!t) return hideTip();
  const r = t.getBoundingClientRect(), side = t.closest('.rail');
  tip.textContent = t.dataset.tip; tip.hidden = false;
  tip.style.left = `${side ? r.right + 8 : r.left}px`;
  tip.style.top = `${side ? r.top + r.height / 2 - tip.offsetHeight / 2 : r.bottom + 6}px`;
});

addEventListener('load', () => { applyScheme(); render(); });
</script>
</body>
</html>
